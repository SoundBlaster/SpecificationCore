name: Inlining trait compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/SpecificationCore/**'
      - 'Package.swift'
      - 'Tests/**'
      - '.github/workflows/inlining-trait.yml'

permissions:
  contents: read

jobs:
  semantics:
    name: Trait semantic suite (${{ matrix.mode }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: defaults
            flags: ''
          - mode: disabled
            flags: '--disable-default-traits'
          - mode: performance-and-tracing
            flags: '--traits AggressiveInlining,Tracing'
          - mode: tracing-only
            flags: '--traits Tracing'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify the selected trait combination
        run: swift test ${{ matrix.flags }}
