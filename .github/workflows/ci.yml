name: CI

on:
  push:
    branches: [ '**' ]  # Run on all branches to test workflow changes
  pull_request:
    branches: [ '**' ]  # Run on all pull requests regardless of target branch
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-macos:
    name: Test on macOS (${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '16.4'
          - os: macos-latest
            xcode: 'latest-stable'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

      - name: Build and test tracing
        run: |
          swift build --traits Tracing
          swift test --traits Tracing

      - name: Run Thread Sanitizer
        if: matrix.xcode == '16.4'
        run: swift test --sanitize=thread

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift: ['6.1', '6.4']
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  lint:
    name: SwiftFormat Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting of changed Swift files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            swiftformat --lint .
            exit $?
          fi

          git fetch --no-tags origin "${{ github.base_ref || 'main' }}" "${{ github.sha }}"
          base="origin/${{ github.base_ref || 'main' }}"
          files=$(git diff --name-only "$base...${{ github.sha }}" -- '*.swift')
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files" | while IFS= read -r file; do
              swiftformat --lint "$file"
            done
          else
            echo "No changed Swift files to format-check."
          fi

  policy-performance:
    name: Cross-module Release policy performance
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate report parser and regression gate
        run: python3 scripts/test_policy_performance_report.py
      - name: Compare the same consumer against baseline and candidate
        env:
          POLICY_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline="$POLICY_BASELINE_SHA"
          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
            baseline=origin/main
          fi
          python3 scripts/compare_policy_performance.py --baseline-ref "$baseline"
      - name: Publish comparison summary
        if: always()
        run: |
          if [[ -f .build/policy-performance/report.md ]]; then
            cat .build/policy-performance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-module-policy-performance
          path: |
            .build/policy-performance/*.csv
            .build/policy-performance/*.json
            .build/policy-performance/*.md
            .build/policy-performance/*.log
          if-no-files-found: warn
          retention-days: 14

  static-first-match-performance:
    name: Cross-module StaticFirstMatch Release performance
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate report parser and regression gate
        run: python3 scripts/test_static_first_match_performance.py
      - name: Run separate-module Release benchmark and gate
        run: python3 scripts/check_static_first_match_performance.py
      - name: Publish comparison summary
        if: always()
        run: |
          if [[ -f .build/static-first-match-performance/report.md ]]; then
            cat .build/static-first-match-performance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-first-match-performance
          path: |
            .build/static-first-match-performance/*.csv
            .build/static-first-match-performance/*.json
            .build/static-first-match-performance/*.md
            .build/static-first-match-performance/*.log
          if-no-files-found: warn
          retention-days: 14

  build-release:
    name: Build Release Configuration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: swift build -c release
