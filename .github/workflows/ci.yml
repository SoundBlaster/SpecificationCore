name: CI

on:
  push:
    branches: [ '**' ]  # Run on all branches to test workflow changes
  pull_request:
    branches: [ '**' ]  # Run on all pull requests regardless of target branch
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-macos:
    name: Test on macOS (${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            xcode: '15.4'
          - os: macos-latest
            xcode: 'latest-stable'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

      - name: Run Thread Sanitizer
        run: swift test --sanitize=thread

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift: ['5.10', '6.0']
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  lint:
    name: SwiftFormat Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting of changed Swift files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            swiftformat --lint .
            exit $?
          fi

          git fetch --no-tags origin "${{ github.base_ref || 'main' }}" "${{ github.sha }}"
          base="origin/${{ github.base_ref || 'main' }}"
          files=$(git diff --name-only "$base...${{ github.sha }}" -- '*.swift')
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files" | while IFS= read -r file; do
              swiftformat --lint "$file"
            done
          else
            echo "No changed Swift files to format-check."
          fi

  build-release:
    name: Build Release Configuration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: swift build -c release
